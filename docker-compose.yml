services:
  app:
    build: .

    container_name: employee_app

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/employee_db

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: employee_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: employee_postgres_data